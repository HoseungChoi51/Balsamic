[project]
name = "single-oven-total-tardiness"
version = "0.1.1"
description = "단일 오븐 주문 순서의 총 고객 대기 시간 최소화"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.entry-points."optimization_framework.problems"]
single_oven_total_tardiness = "single_oven_total_tardiness.adapter:problem_adapter"

[project.entry-points."optimization_framework.optimizers"]
single_oven_total_tardiness = "single_oven_total_tardiness.adapter:method_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["single_oven_total_tardiness"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

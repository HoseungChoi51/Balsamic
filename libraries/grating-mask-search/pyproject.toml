[project]
name = "grating-mask-search"
version = "0.1.2"
description = "Binary-mask search methods for the 2D grating deflector, offered to Balsamic as optimizer plug-ins"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."optimization_framework.optimizers"]
grating_mask_search = "grating_mask_search.plugin:GratingMaskSearchPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grating_mask_search"]

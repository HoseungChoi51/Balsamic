[project]
name = "single-oven-total-tardiness"
version = "0.2.1"
description = "단일 오븐 굽기 순서의 총 고객 대기 시간 최소화"
requires-python = ">=3.11"
dependencies = ["numpy>=2.4.2,<3"]

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."optimization_framework.optimizers"]
single_oven_total_tardiness = "single_oven_total_tardiness.plugin:Plugin"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["single_oven_total_tardiness"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
